name: amateur-ai-drama-odyssey

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: AADO
      POSTGRES_USER: aado
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - aado_pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aado -d AADO"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: /data/next-ai-ws/amateur-ai-drama-odyssey
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://aado:${POSTGRES_PASSWORD}@postgres:5432/AADO
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
    ports:
      - "${API_PORT:-6868}:4000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: /data/next-ai-ws/amateur-ai-drama-odyssey
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://aado:${POSTGRES_PASSWORD}@postgres:5432/AADO
    command: ["python", "-m", "apps.worker.main"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  aado_pgdata:

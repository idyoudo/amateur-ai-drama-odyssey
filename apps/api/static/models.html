<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>AADO 模型参数配置</title>
<style>
body{font-family:system-ui,sans-serif;margin:2em;max-width:720px}
table{border-collapse:collapse;width:100%}
td,th{border:1px solid #ccc;padding:6px;text-align:left}
input{width:100%;box-sizing:border-box}
button{margin-top:1em;padding:6px 14px}
pre{background:#f4f4f4;padding:8px;font-size:12px}
</style>
</head>
<body>
<div id="login" style="position:fixed;inset:0;background:rgba(5,8,13,.97);display:flex;align-items:center;justify-content:center;z-index:99">
  <div style="background:#1a2029;border:1px solid #2a3442;border-radius:14px;padding:24px;width:320px">
    <h1 style="margin:0 0 16px">登录 AADO</h1>
    <form id="loginform" style="display:flex;flex-direction:column;gap:10px">
      <input name="username" placeholder="用户名" value="admin">
      <input name="password" type="password" placeholder="密码">
      <button type="submit">登录</button>
      <div id="loginerr" style="color:#e06c6c;font-size:12px;display:none"></div>
    </form>
  </div>
</div>
<h1>模型参数配置</h1>
<p>model + API Key 齐备则该类型走真实供应商；缺一则走 Mock（自证链路）。</p>
<table>
<thead><tr><th>类型</th><th>模型名</th><th>API Key</th><th>API URL</th></tr></thead>
<tbody id="rows"></tbody>
</table>
<button onclick="save()">保存</button>
<pre id="status"></pre>
<script>
const KINDS=["video","image","tts","music","lipsync"];
const TK="aado_token";
function ah(){const t=localStorage.getItem(TK);return t?{"Authorization":"Bearer "+t}:{}}
document.getElementById("loginform").onsubmit=async e=>{
  e.preventDefault();const f=new FormData(e.target);
  const r=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:f.get("username"),password:f.get("password")})});
  if(r.ok){const d=await r.json();localStorage.setItem(TK,d.token);document.getElementById("login").style.display="none";load();}
  else{const x=document.getElementById("loginerr");x.style.display="block";x.textContent="用户名或密码错误";}
};
async function load(){
  const r=await fetch("/api/models/config",{headers:ah()});
  const d=await r.json();
  document.getElementById("rows").innerHTML=KINDS.map(k=>{
    const c=(d.config||{})[k]||{};
    return `<tr><td>${k}</td>
      <td><input id="${k}_model" value="${c.model||''}"></td>
      <td><input id="${k}_key" value="${c.api_key||''}"></td>
      <td><input id="${k}_url" value="${c.api_url||''}"></td></tr>`;
  }).join("");
}
async function save(){
  const config={};
  for(const k of KINDS){
    config[k]={
      model:document.getElementById(k+"_model").value,
      api_key:document.getElementById(k+"_key").value,
      api_url:document.getElementById(k+"_url").value
    };
  }
  const r=await fetch("/api/models/config",{method:"PUT",headers:Object.assign({"Content-Type":"application/json"},ah()),body:JSON.stringify({config})});
  document.getElementById("status").textContent="已保存："+JSON.stringify(await r.json());
}
if(localStorage.getItem(TK)){document.getElementById("login").style.display="none";load()}
</script>
</body>
</html>

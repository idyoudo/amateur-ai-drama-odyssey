<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>AADO 模型参数配置</title>
<style>
body{font-family:"Inter",system-ui,-apple-system,"PingFang SC",sans-serif;margin:0;background:#F7F8F7;color:#18181B}
.wrap{max-width:820px;margin:0 auto;padding:40px 24px}
h1{font-size:20px;font-weight:650;letter-spacing:-.01em;margin:0 0 6px}
p.sub{color:#71717A;font-size:13px;margin:0 0 22px}
table{border-collapse:separate;border-spacing:0;width:100%;background:#fff;border:1px solid #E4E4E7;border-radius:14px;overflow:hidden}
td,th{border-bottom:1px solid #E4E4E7;padding:12px 14px;text-align:left;font-size:13px}
th{background:#F4F5F6;color:#71717A;font-weight:500;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
tr:last-child td{border-bottom:0}
input,select{width:100%;box-sizing:border-box;padding:8px 11px;border:1px solid #D4D4D8;border-radius:9px;font-size:13px;background:#fff;color:#18181B;font-family:inherit}
input:focus,select:focus{outline:none;border-color:#4F46E5;box-shadow:0 0 0 3px #EEF0FE}
button{margin-top:18px;padding:9px 18px;background:#18181B;color:#fff;border:0;border-radius:9px;font-weight:550;font-size:13px;cursor:pointer}
button:hover{background:#000}
pre{background:#F4F5F6;border:1px solid #E4E4E7;border-radius:10px;padding:12px;font-size:12px;color:#52525B;overflow:auto}
code{font-family:"JetBrains Mono",ui-monospace,monospace}
</style>
</head>
<body>
<div id="login" style="position:fixed;inset:0;background:#F7F8F7;display:flex;align-items:center;justify-content:center;z-index:99">
  <div style="background:#fff;border:1px solid #E4E4E7;border-radius:16px;padding:28px;width:340px;box-shadow:0 8px 32px rgba(24,24,27,.1)">
    <h1 style="margin:0 0 16px;font-size:16px">登录 AADO</h1>
    <form id="loginform" style="display:flex;flex-direction:column;gap:10px">
      <input name="username" placeholder="用户名" value="admin" style="margin:8px 0">
      <input name="password" type="password" placeholder="密码" style="margin:8px 0">
      <button type="submit" style="width:100%;margin-top:6px">登录</button>
      <div id="loginerr" style="color:#EF4444;font-size:12px;display:none"></div>
    </form>
  </div>
</div>
<div class="wrap"><h1>模型参数配置</h1>
<p class="sub">model + API Key 齐备则该类型走真实供应商；缺一则走 Mock（自证链路）。从下拉选厂商即自动填 URL 与推荐模型。</p>
<table>
<thead><tr><th>类型</th><th>模型名</th><th>API Key</th><th>API URL</th></tr></thead>
<tbody id="rows"></tbody>
</table>
<button onclick="save()">保存</button>
<pre id="status"></pre></div>
<script>
const KINDS=["text","video","image","tts","music","lipsync"];
const TK="aado_token";
function ah(){const t=localStorage.getItem(TK);return t?{"Authorization":"Bearer "+t}:{}}
document.getElementById("loginform").onsubmit=async e=>{
  e.preventDefault();const f=new FormData(e.target);
  const r=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:f.get("username"),password:f.get("password")})});
  if(r.ok){const d=await r.json();localStorage.setItem(TK,d.token);document.getElementById("login").style.display="none";load();}
  else{const x=document.getElementById("loginerr");x.style.display="block";x.textContent="用户名或密码错误";}
};
async function load(msg){
  const r=await fetch("/api/models/config",{headers:ah()});
  const d=await r.json();
  const presets=d.presets||{};
  document.getElementById("rows").innerHTML=KINDS.map(k=>{
    const c=(d.config||{})[k]||{};
    const ps=(presets[k]||[]);
    const ph=c.api_key_set?("已设置 "+c.api_key_hint+"（留空不修改）"):"未设置（留空走 Mock）";
    return `<tr><td>${k}<br><select onchange="applyPreset('${k}',this.value)" style="margin-top:4px">
        <option value="">选厂商…</option>
        ${ps.map((p,i)=>`<option value="${i}">${p.vendor}</option>`).join("")}</select></td>
      <td><input id="${k}_model" value="${c.model||''}"></td>
      <td><input id="${k}_key" type="password" autocomplete="new-password" value="" placeholder="${ph}">
        <label style="display:flex;gap:6px;align-items:center;font-size:11.5px;color:#71717A;margin-top:6px">
          <input type="checkbox" id="${k}_clear" style="width:auto;margin:0">清除已保存 Key</label></td>
      <td><input id="${k}_url" value="${c.api_url||''}"></td></tr>`;
  }).join("");
  document.getElementById("status").textContent = msg || (d.persistence
    ? "配置存储：" + d.persistence.note + " · Key 仅显示末四位，永不回传明文"
    : "");
  window._PRESETS=presets;
}
function applyPreset(k,i){
  if(i==="")return; const p=(window._PRESETS[k]||[])[i]; if(!p)return;
  document.getElementById(k+"_model").value=p.model;
  document.getElementById(k+"_url").value=p.api_url;
}
async function save(){
  const config={};
  for(const k of KINDS){
    const c={model:document.getElementById(k+"_model").value,
             api_url:document.getElementById(k+"_url").value};
    const key=document.getElementById(k+"_key").value.trim();
    if(key)c.api_key=key;                       // 空值=保留原 Key；掩码永不回填
    if(document.getElementById(k+"_clear").checked)c.api_key_clear=true;
    config[k]=c;
  }
  const r=await fetch("/api/models/config",{method:"PUT",headers:Object.assign({"Content-Type":"application/json"},ah()),body:JSON.stringify({config})});
  const d=await r.json().catch(()=>({}));
  if(r.ok){
    const msg="已保存 · 已配置："+((d.available||[]).join("、")||"无（全部走 Mock）")
      +((d.warnings&&d.warnings.length)?" · 提示："+d.warnings.join("；"):"")
      +(d.persistence?" · "+d.persistence.note:"");
    load(msg);
  }else{
    document.getElementById("status").textContent="保存失败："+(d.detail||("HTTP "+r.status));
  }
}
if(localStorage.getItem(TK)){document.getElementById("login").style.display="none";load()}
</script>
</body>
</html>
